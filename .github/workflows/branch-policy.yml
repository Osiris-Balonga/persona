name: Branch policy

on:
  pull_request:
    branches: [dev, main]

jobs:
  source-policy:
    name: source-policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request source
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "Pull requests must originate from a branch in this repository."
            exit 1
          fi

          if [ "$BASE_BRANCH" = "main" ]; then
            if [ "$HEAD_BRANCH" != "dev" ]; then
              echo "Only dev may target main."
              exit 1
            fi
          elif [ "$BASE_BRANCH" = "dev" ]; then
            case "$HEAD_BRANCH" in
              feature/*|fix/*|chore/*|docs/*|refactor/*|test/*|dependabot/*) ;;
              *)
                echo "Working branches must use an approved prefix."
                exit 1
                ;;
            esac
          fi
