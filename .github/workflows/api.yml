name: API

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  api-checks:
    name: api-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:availability:check
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm run check:analytics-storage
      - run: npm run build:analytics-worker
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run build:worker
